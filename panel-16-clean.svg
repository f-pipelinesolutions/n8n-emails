<svg xmlns="http://www.w3.org/2000/svg" width="420" height="116" viewBox="0 0 420 116" style="overflow:visible;display:block;">
  <style><![CDATA[text{font-family:'Space Grotesk',system-ui,sans-serif;}]]></style>
  <defs>
    <clipPath id="cp"><rect width="420" height="116" rx="20" ry="20"/></clipPath>
    <clipPath id="sc"><rect x="93" y="56" width="297" height="32"/></clipPath>
  </defs>
  <g clip-path="url(#cp)">
    <!-- Avatar -->
    <circle cx="48" cy="58" r="27" fill="#06B6D4"/>
    <text x="48" y="58" font-size="14" fill="white" font-weight="600" text-anchor="middle" dominant-baseline="central">AM</text>
    <!-- Name + timestamp -->
    <text x="93" y="44" font-size="17" fill="#FFFFFF" font-weight="400" text-anchor="start" dominant-baseline="central">Agnes Marvin</text>
    <text x="398" y="44" font-size="12" fill="rgba(255,255,255,0.28)" text-anchor="end" dominant-baseline="central">15m</text>
    <!-- Snippet (clipped) -->
    <text x="93" y="72" font-size="13" fill="rgba(255,255,255,0.55)" text-anchor="start" dominant-baseline="central" clip-path="url(#sc)">Looking forward to tomorrow!</text>
  </g>
</svg>
